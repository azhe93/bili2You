<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bili2You - B站弹幕同步</title>
    <link rel="stylesheet" href="popup.css">
</head>

<body>
    <div class="container">
        <!-- Page Info Section (Auto-detected) -->
        <section id="pageInfoSection" class="page-info-section">
            <div class="section-title">
                <span>连接状态</span>
                <span class="pulse-indicator"></span>
            </div>
            <div class="page-info-row">
                <span class="label">当前频道</span>
                <span id="channelName" class="value">检测中...</span>
            </div>
            <div class="page-info-row">
                <span class="label">当前视频</span>
                <span id="videoTitle" class="value ellipsis">检测中...</span>
            </div>
        </section>

        <!-- Uploader Mapping Section -->
        <section id="uploaderSection" class="uploader-section hidden">
            <h2 class="section-title">关联B站UP主</h2>
            <div id="uploaderMapping" class="uploader-mapping">
                <div id="mappedUploader" class="mapped-uploader hidden">
                    <img id="mappedUploaderAvatar" class="up-avatar" src="" alt="avatar">
                    <span id="mappedUploaderName" class="up-name"></span>
                    <button id="changeUploader" class="btn-small">更换</button>
                </div>
                <div id="uploaderSearch" class="uploader-search">
                    <input type="text" id="uploaderSearchInput" placeholder="搜索B站UP主...">
                    <button id="uploaderSearchBtn" class="btn-search-small">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                        <span>搜索</span>
                    </button>
                </div>
                <div id="uploaderResults" class="uploader-results hidden"></div>
            </div>
        </section>

        <!-- Video Match Section -->
        <section id="videoMatchSection" class="video-match-section hidden">
            <h2 class="section-title">
                <span>匹配视频</span>
                <span id="matchStatus" class="match-status"></span>
            </h2>
            
            <div id="matchedVideo" class="matched-video hidden">
                <img id="matchedThumb" class="matched-thumb" src="" alt="thumbnail">
                <div class="matched-info">
                    <div id="matchedTitle" class="matched-title"></div>
                    <div class="matched-meta">
                        <span id="matchedScore" class="match-score"></span>
                        <span id="matchedDanmaku" class="danmaku-count"></span>
                    </div>
                </div>
                <button id="changeVideo" class="btn-small">更换</button>
            </div>
            
            <div id="videoSearch" class="video-search hidden">
                <input type="text" id="videoSearchInput" placeholder="搜索B站视频...">
                <button id="videoSearchBtn" class="btn-search-small">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    <span>搜索</span>
                </button>
            </div>
            
            <div id="videoResults" class="video-results hidden"></div>
            
            <div class="action-row">
                <button id="loadDanmakuBtn" class="btn-primary hidden">加载弹幕</button>
                <!-- Toggle Danmaku (placed on the right side of the action button) -->
                <div class="danmaku-toggle-inline">
                    <span class="toggle-label">显示弹幕</span>
                    <label class="switch">
                        <input type="checkbox" id="showDanmaku" checked>
                        <span class="slider"></span>
                    </label>
                </div>
            </div>
        </section>

        <!-- Loading State -->
        <div id="loading" class="loading hidden">
            <div class="spinner"></div>
            <span id="loadingText">加载中...</span>
        </div>

        <!-- Settings Section -->
        <section class="settings-section">
            <h2 class="section-title">
                <span>个性化设置</span>
                <button id="toggleSettings" class="btn-toggle" aria-label="Toggle settings">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
                </button>
            </h2>
            <div id="settingsPanel" class="settings-panel hidden">
                <!-- Time Offset -->
                <div class="setting-item">
                    <label for="offsetInput">时间偏移</label>
                    <div class="offset-controls">
                        <button id="offsetMinus" class="btn-offset">-1s</button>
                        <input type="number" id="offsetInput" value="0" step="0.5">
                        <button id="offsetPlus" class="btn-offset">+1s</button>
                    </div>
                </div>

                <!-- Font Size -->
                <div class="setting-item">
                    <label for="fontSize">字体大小</label>
                    <div class="slider-wrapper">
                        <input type="range" id="fontSize" min="12" max="36" value="24">
                        <span id="fontSizeValue" class="slider-value">24px</span>
                    </div>
                </div>

                <!-- Opacity -->
                <div class="setting-item">
                    <label for="opacity">不透明度</label>
                    <div class="slider-wrapper">
                        <input type="range" id="opacity" min="0.1" max="1" step="0.1" value="0.8">
                        <span id="opacityValue" class="slider-value">80%</span>
                    </div>
                </div>

                <!-- Speed -->
                <div class="setting-item">
                    <label for="speed">滚动速度</label>
                    <div class="slider-wrapper">
                        <input type="range" id="speed" min="5" max="20" value="10">
                        <span id="speedValue" class="slider-value">10s</span>
                    </div>
                </div>

                <!-- Screen Height -->
                <div class="setting-item">
                    <label for="screenHeight">屏幕高度</label>
                    <div class="slider-wrapper">
                        <input type="range" id="screenHeight" min="20" max="100" step="10" value="80">
                        <span id="screenHeightValue" class="slider-value">80%</span>
                    </div>
                </div>

                <!-- Density -->
                <div class="setting-item">
                    <label for="density">弹幕密度</label>
                    <div class="select-wrapper">
                        <select id="density">
                            <option value="1">全部</option>
                            <option value="0.75">75%</option>
                            <option value="0.5" selected>50%</option>
                            <option value="0.25">25%</option>
                        </select>
                    </div>
                </div>
            </div>
        </section>

        <!-- Not on YouTube Message -->
        <div id="notYouTube" class="not-youtube hidden">
            <svg class="warning-icon" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
                <line x1="12" y1="9" x2="12" y2="13"></line>
                <line x1="12" y1="17" x2="12.01" y2="17"></line>
            </svg>
            <p>请在 YouTube 视频播放页面使用此扩展</p>
        </div>
    </div>

    <script src="../lib/opencc-t2cn.js"></script>
    <script src="popup.js"></script>
</body>

</html>
